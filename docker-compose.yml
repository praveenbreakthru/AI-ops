services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aiops-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - aiops-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aiops-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - aiops-network

networks:
  aiops-network:
    driver: bridge
