groups:
  - name: windows_alert_rules
    rules:
      - alert: WindowsExporterDown
        expr: up{job="windows-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Windows Exporter is unavailable"
          description: "Prometheus cannot scrape windows_exporter at host.docker.internal:9182 for more than 1 minute."

      - alert: HostCpuHighUtilization
        expr: instance:cpu_utilization:percent > 85
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Host CPU utilization above 85%"
          description: "Sustained high CPU usage detected on {{ $labels.instance }}: {{ $value | printf \"%.1f\" }}%."

      - alert: HostCpuCriticalSpike
        expr: instance:cpu_utilization:percent > 95
        for: 2m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "Host CPU utilization critical (> 95%)"
          description: "Dangerous CPU saturation on {{ $labels.instance }}: {{ $value | printf \"%.1f\" }}%."

      - alert: HostMemoryPressureHigh
        expr: instance:memory_utilization:percent > 90
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Host RAM utilization above 90%"
          description: "Physical RAM nearly exhausted on {{ $labels.instance }}: {{ $value | printf \"%.1f\" }}% used."

      - alert: HostMemoryCritical
        expr: instance:memory_utilization:percent > 95
        for: 2m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "Host RAM critically low (> 95%)"
          description: "Severe memory exhaustion threatening system stability on {{ $labels.instance }}."

      - alert: DiskSpaceLow
        expr: instance:disk_free_percent < 10
        for: 5m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "Disk volume free space below 10%"
          description: "Volume {{ $labels.volume }} on {{ $labels.instance }} has only {{ $value | printf \"%.1f\" }}% free space."

      - alert: DiskSpaceCriticallyLow
        expr: instance:disk_free_percent < 5
        for: 2m
        labels:
          severity: critical
          category: storage
        annotations:
          summary: "Disk volume free space below 5%"
          description: "Volume {{ $labels.volume }} on {{ $labels.instance }} has only {{ $value | printf \"%.1f\" }}% free space remaining!"

      - alert: LaptopBatteryCritical
        expr: windows_hardware_battery_percent < 15 and windows_hardware_battery_status == 1
        for: 2m
        labels:
          severity: critical
          category: power
        annotations:
          summary: "Laptop battery critical while discharging"
          description: "Battery charge is below 15% (current: {{ $value }}%) and discharging without AC power."

      - alert: NetworkPacketErrorsHigh
        expr: rate(windows_net_packets_outbound_errors_total[2m]) + rate(windows_net_packets_received_errors_total[2m]) > 5
        for: 2m
        labels:
          severity: warning
          category: network
        annotations:
          summary: "Network interface experiencing packet errors"
          description: "NIC {{ $labels.nic }} is dropping or corrupting packets."
