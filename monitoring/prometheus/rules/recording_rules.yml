groups:
  - name: windows_recording_rules
    interval: 15s
    rules:
      # CPU Utilization (%)
      - record: instance:cpu_utilization:percent
        expr: 100 - (avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[1m])) * 100)

      # User vs Privileged CPU Modes (%)
      - record: instance:cpu_user:percent
        expr: avg by (instance) (rate(windows_cpu_time_total{mode="user"}[1m])) * 100

      - record: instance:cpu_privileged:percent
        expr: avg by (instance) (rate(windows_cpu_time_total{mode="privileged"}[1m])) * 100

      # Memory Utilization (%)
      - record: instance:memory_used_bytes
        expr: windows_os_visible_memory_bytes - windows_memory_available_bytes

      - record: instance:memory_utilization:percent
        expr: 100 * (1 - (windows_memory_available_bytes / windows_os_visible_memory_bytes))

      # Logical Disk Free & Used (%)
      - record: instance:disk_free_percent
        expr: 100 * (windows_logical_disk_free_bytes / windows_logical_disk_size_bytes)

      - record: instance:disk_used_percent
        expr: 100 * (1 - (windows_logical_disk_free_bytes / windows_logical_disk_size_bytes))

      # Disk Read & Write Throughput (Bytes/sec)
      - record: instance:disk_read_bytes:rate1m
        expr: sum by (instance, volume) (rate(windows_logical_disk_read_bytes_total[1m]))

      - record: instance:disk_write_bytes:rate1m
        expr: sum by (instance, volume) (rate(windows_logical_disk_write_bytes_total[1m]))

      # Network Interface Throughput (Bytes/sec)
      - record: instance:network_receive_bytes:rate1m
        expr: sum by (instance, nic) (rate(windows_net_bytes_received_total[1m]))

      - record: instance:network_transmit_bytes:rate1m
        expr: sum by (instance, nic) (rate(windows_net_bytes_sent_total[1m]))
