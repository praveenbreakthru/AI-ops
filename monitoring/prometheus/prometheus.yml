global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'windows-aiops-platform'
    environment: 'laptop-local'

rule_files:
  - 'rules/recording_rules.yml'
  - 'rules/alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'windows-exporter'
    scrape_interval: 10s
    scrape_timeout: 8s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9182']
        labels:
          instance: 'windows-laptop'
          os: 'windows-11'
          role: 'primary-workstation'

  - job_name: 'aiops-backend'
    scrape_interval: 15s
    metrics_path: '/api/health/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'aiops-fastapi-backend'
